<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Frontera Finds verified-seller seal">
  <defs>
    <radialGradient id="ffLeaf" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#8FE6A3"/>
      <stop offset="55%" stop-color="#23A84B"/>
      <stop offset="100%" stop-color="#1A6B33"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#F5F1E8"/>

  <!-- Seal rings -->
  <circle cx="800" cy="450" r="360" fill="none" stroke="#1A6B33" stroke-width="3"/>
  <circle cx="800" cy="450" r="345" fill="none" stroke="#1A6B33" stroke-width="1.5"/>

  <!-- Curved seal text -->
  <defs>
    <path id="ffArcTop" d="M 478,450 A 322,322 0 0 1 1122,450" fill="none"/>
